targets:
  $default:
    builders:
      swagger_dart_code_generator:
        options:
          input_folder: lib/swaggers/
          output_folder: lib/src/generated
          override_equals_and_hashcode: true
          input_urls:
            - url: https://docs.docker.com/reference/api/engine/version/v1.53.yaml
              file_name: docker.yaml
      json_serializable:
        generate_for:
          - lib/src/generated/*.dart
      chopper_generator:
        generate_for:
          - lib/src/generated/*.dart
